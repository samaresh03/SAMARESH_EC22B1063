  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   networks:
  #     - quant-network
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U quant_user"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # Optional: Redis cache for production
  # redis:
  #   image: redis:7-alpine
  #   container_name: quant-redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data
  #   networks:
  #     - quant-network
  #   restart: unless-stopped
